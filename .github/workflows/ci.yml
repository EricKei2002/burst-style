name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      - run: npx eslint app

      - run: npx prettier --check app

      # ブラウザ・サーバー不要の Node 単体テスト
      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # next build の型検査は TS 6（typescript エイリアス）を使うため、TS 7 の tsc はここで実行する
      - run: npm run typecheck
