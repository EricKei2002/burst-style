name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # .cursor/ 配下のツール用スクリプトはlint対象に含めない(eslint.config.mjsの
      # デフォルトignoreには未追加のため、CI側でapp/のみに限定)
      - run: npx eslint app

      - run: npx prettier --check app

      - run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
